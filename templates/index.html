
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 40px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #173b67;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Performance Predictor</h1>
        <p>Enter your details below.</p>

        <form action="/predict" method="POST">
            <label for="hours">Study hours per day</label>
            <input type="number" id="hours" name="hours"
                   min="0" max="24" step="0.5" required>

            <label for="attendance">Attendance (%)</label>
            <input type="number" id="attendance" name="attendance"
                   min="0" max="100" required>

            <label for="marks">Previous exam marks (%)</label>
            <input type="number" id="marks" name="marks"
                   min="0" max="100" required>

            <button type="submit">Predict Performance</button>
        </form>
    </div>
</body>
</html>
